<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<meta name="description" content="Canary Web: RPG 3D no navegador com dados reais do servidor Canary (monstros, XP, vocações).">
<title>Canary Web</title>
<style>
:root{--bg:#10151c;--fg:#e8edf3;--hp:#d94b4b;--mp:#4b7fd9;--xp:#d9b84b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:8px;display:grid;gap:3px;max-width:420px;pointer-events:none}
.bar{height:12px;background:#0008;border-radius:6px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:100%}.bar span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:12px}
#hp i{background:var(--hp)}#mp i{background:var(--mp)}#xp i{background:var(--xp)}
#info{font-weight:600;text-shadow:0 1px 2px #000}
#log{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0) + 92px);max-width:60%;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none}
#joy{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0) + 24px);width:120px;height:120px;border-radius:50%;background:#fff2;border:2px solid #fff4}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffa}
#btns{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0) + 24px);display:grid;grid-template-columns:repeat(2,64px);gap:10px}
#btns button{height:64px;border-radius:50%;border:2px solid #fff5;background:#2a3544cc;color:var(--fg);font-size:11px;font-weight:700;touch-action:manipulation}
#btns button:active{background:#4a5c75}
#menu{position:fixed;inset:0;background:#10151cf2;display:grid;place-content:center;gap:12px;text-align:center;padding:16px}
#menu button{padding:14px 20px;font-size:16px;border-radius:10px;border:0;background:#2f6fb5;color:#fff;touch-action:manipulation}
#menu h1{margin:0}#menu p{margin:0;opacity:.75;max-width:340px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<canvas id="c" aria-label="Mundo do jogo"></canvas>
<header id="hud" hidden>
<div id="info"></div>
<div class="bar" id="hp"><i></i><span></span></div>
<div class="bar" id="mp"><i></i><span></span></div>
<div class="bar" id="xp"><i></i><span></span></div>
</header>
<aside id="log" aria-live="polite"></aside>
<nav id="ctl" hidden>
<div id="joy" role="application" aria-label="Joystick"><i id="knob"></i></div>
<div id="btns">
<button data-s="0">⚔<br>Golpe</button><button data-s="1">💥<br>Área</button>
<button data-s="2">💚<br>Exura</button><button data-s="3">💨<br>Haste</button>
</div>
</nav>
<section id="menu">
<h1>Canary Web</h1>
<p>Mapa real do Canary (canary.otbm, andar 7, região de Montag), com 668 monstros reais (ataques, loot, XP), fórmula de XP e vocações do datapack. Quanto mais longe da cidade, mais forte o monstro. Sprites originais não existem no repositório: o visual usa cores por tipo de item.</p>
<p id="saved"></p>
<button data-v="0">Knight</button><button data-v="1">Paladin</button><button data-v="2">Sorcerer</button><button data-v="3">Druid</button>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// Monstros reais do Canary (668): map/monsters.json (vida, XP, velocidade, ataques, loot) gerado dos .lua
let MON=[];
// Vocações (vocations.xml): ganho de vida/mana por nível, começando em 185/35 no nível 8
const VOC=[{n:"Knight",gh:15,gm:5,r:2.6,pw:1.5,col:0xb0b8c4},{n:"Paladin",gh:10,gm:15,r:9,pw:1.2,col:0xd9a441},{n:"Sorcerer",gh:5,gm:30,r:9,pw:1.1,col:0xc04bd9},{n:"Druid",gh:5,gm:30,r:9,pw:1.0,col:0x4bd98a}];
const SPELL=[{mp:20,cd:2.5,m:2.2},{mp:60,cd:6,m:1.4,aoe:5},{mp:25,cd:1.5,heal:1},{mp:40,cd:12,haste:1}];
const expFor=l=>Math.round(50/3*(l**3-6*l*l+17*l-12));
const $=s=>document.querySelector(s);
let P=null,mons=[],keys={},joy={x:0,y:0},cds=[0,0,0,0],haste=0,atkCd=0,last=0,saveT=0,deadT=0;
const maxHp=()=>185+(P.l-8)*VOC[P.v].gh, maxMp=()=>35+(P.l-8)*VOC[P.v].gm;
function log(t){const d=document.createElement("div");d.textContent=t;$("#log").append(d);setTimeout(()=>d.remove(),4000);while($("#log").children.length>6)$("#log").firstChild.remove()}
// Cena
const cv=$("#c"),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b6d9);scene.fog=new THREE.Fog(0x87b6d9,30,90);
const cam=new THREE.PerspectiveCamera(55,1,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x446644,1.0));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(20,40,10);scene.add(sun);
// Mapa real: data-canary/world/canary.otbm (andar 7, região Montag/Nahag/Katorga), convertido em map/
const TX=5010.5,TZ=4998.5,TR=60,WN=40;let MP=null,win=null,wcx=-1e9,wcz=-1e9,BL=[];
const mapP=(async()=>{try{const mr=await fetch("map/monsters.json");if(!mr.ok)throw new Error("monsters.json "+mr.status);MON=await mr.json();const m=await(await fetch("map/map.json")).json();const r=await fetch("map/floor7.bin.gz");if(!r.ok)throw new Error("map/floor7.bin.gz "+r.status);
  let b=new Uint8Array(await r.arrayBuffer());if(b[0]==0x1f&&b[1]==0x8b)b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());MP=m;MP.b=b;
  BL=m.pal.map((c,i)=>i==0||(c[0]==40&&c[1]==100&&c[2]==190)||(c[0]==220&&c[1]==70&&c[2]==20)||(c[0]==0&&c[1]==0&&c[2]==0));return null}catch(e){return e}})();
function tl(x,z){x=Math.floor(x);z=Math.floor(z);if(!MP||x<MP.x0||z<MP.y0||x>=MP.x0+MP.w||z>=MP.y0+MP.h)return[0,1];const i=((z-MP.y0)*MP.w+(x-MP.x0))*2;return[MP.b[i],MP.b[i+1]]}
function blocked(x,z){const t=tl(x,z);return t[1]>0||BL[t[0]]}
const tg=new THREE.BoxGeometry(1,1,1),tm=new THREE.MeshLambertMaterial({color:0xffffff});
function rebuild(){const cx=Math.floor(P.x),cz=Math.floor(P.z);if(Math.abs(cx-wcx)<8&&Math.abs(cz-wcz)<8)return;wcx=cx;wcz=cz;
  if(win){scene.remove(win);win.dispose()}const N=(2*WN+1)**2;win=new THREE.InstancedMesh(tg,tm,N);const mt=new THREE.Matrix4(),c=new THREE.Color();let k=0;
  for(let dz=-WN;dz<=WN;dz++)for(let dx=-WN;dx<=WN;dx++){const x=cx+dx,z=cz+dz,t=tl(x,z),h=t[1]?1.6:.2;const p=MP.pal[t[1]||t[0]];
    mt.makeScale(1,h,1);mt.setPosition(x+.5,h/2-.2,z+.5);win.setMatrixAt(k,mt);c.setRGB(p[0]/255,p[1]/255,p[2]/255);win.setColorAt(k,c);k++}
  win.instanceMatrix.needsUpdate=true;win.instanceColor.needsUpdate=true;win.frustumCulled=false;scene.add(win)}
const hero=new THREE.Group();const hb=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,1.6,12),new THREE.MeshLambertMaterial({color:0xffffff}));hb.position.y=.9;hero.add(hb);scene.add(hero);
const fx=[];function flash(x,z,r,c){const m=new THREE.Mesh(new THREE.RingGeometry(r*.8,r,24),new THREE.MeshBasicMaterial({color:c,transparent:true,side:2}));m.rotation.x=-Math.PI/2;m.position.set(x,.15,z);scene.add(m);fx.push({m,t:.3})}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return new THREE.Color().setHSL(h/360,.55,.5)}
function spawn(m){m=m||{};let x=TX,z=TZ,d=14;for(let k=0;k<60;k++){const a=Math.random()*6.28;d=14+Math.random()*(TR-14);x=TX+Math.cos(a)*d;z=TZ+Math.sin(a)*d;if(!blocked(x,z))break}
  const t=Math.min(MON.length-1,Math.max(0,Math.round((d-14)/(TR-14)*(MON.length-1)+(Math.random()*4-2))));const c=MON[t];m.c=c;m.hp=c.hp;m.x=x;m.z=z;m.cd=1;m.dead=0;
  if(!m.g){const s=.6+Math.log10(c.hp+10)*.3;const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(s,s*1.2,s),new THREE.MeshLambertMaterial({color:hue(c.n)}));b.position.y=s*.6+.1;const bar=new THREE.Mesh(new THREE.PlaneGeometry(1,.12),new THREE.MeshBasicMaterial({color:0xd94b4b}));bar.position.y=s*1.2+.6;g.add(b,bar);g.userData={bar,s};m.g=g;scene.add(g)}
  m.g.position.set(x,0,z);m.g.userData.bar.scale.x=1;return m}
function setup(){mons.forEach(m=>scene.remove(m.g));mons=[];for(let i=0;i<70;i++)mons.push(spawn())}
// Jogador
function newP(v){return{v,l:8,xp:expFor(8),hp:185,mp:35,gold:0,x:TX,z:TZ+2}}
function save(){try{localStorage.setItem("canaryweb",JSON.stringify(P))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("canaryweb"))}catch(e){return null}}
function gain(x){P.xp+=x;let up=0;while(P.xp>=expFor(P.l+1)){P.l++;up=1}if(up){P.hp=maxHp();P.mp=maxMp();log("Nível "+P.l+"!");flash(P.x,P.z,2,0xffff00)}}
function dmgOf(m){const v=VOC[P.v];return Math.round((8+P.l*v.pw)*m*(.6+Math.random()*.6))}
function hit(mo,d){mo.hp-=d;mo.g.userData.bar.scale.x=Math.max(.01,mo.hp/mo.c.hp);log(mo.c.n+" -"+d);
  if(mo.hp<=0){mo.dead=8;mo.g.visible=false;let g=0;const it=[];for(const l of mo.c.l){if(Math.random()*100000<l[1]){const q=1+Math.floor(Math.random()*l[2]);if(l[0]=="gold coin")g+=q;else if(l[0]=="platinum coin")g+=q*100;else it.push(q+" "+l[0])}}P.gold+=g;gain(mo.c.xp);log("+"+mo.c.xp+" XP, +"+g+" gp ("+mo.c.n+")"+(it.length?" Loot: "+it.join(", "):""))}}
function nearest(r){let b=null,bd=r;for(const m of mons){if(m.dead)continue;const d=Math.hypot(m.x-P.x,m.z-P.z);if(d<bd){bd=d;b=m}}return b}
function cast(i){const s=SPELL[i];if(!P||deadT||cds[i]>0||P.mp<s.mp)return;
  if(s.heal){P.mp-=s.mp;cds[i]=s.cd;P.hp=Math.min(maxHp(),P.hp+Math.round(60+P.l*3));flash(P.x,P.z,1.5,0x44ff88);return}
  if(s.haste){P.mp-=s.mp;cds[i]=s.cd;haste=6;log("Utani hur!");return}
  const v=VOC[P.v];const t=nearest(s.aoe?s.aoe:v.r+1);if(!t&&!s.aoe)return;P.mp-=s.mp;cds[i]=s.cd;
  if(s.aoe){flash(P.x,P.z,s.aoe,0xff8844);for(const m of mons)if(!m.dead&&Math.hypot(m.x-P.x,m.z-P.z)<s.aoe)hit(m,dmgOf(s.m))}
  else{flash(t.x,t.z,1,0xffaa00);hit(t,dmgOf(s.m))}}
function die(){log("Você morreu. -10% de XP");P.xp=Math.max(expFor(8),Math.floor(P.xp*.9));while(P.l>8&&P.xp<expFor(P.l))P.l--;P.hp=maxHp();P.mp=maxMp();P.x=TX;P.z=TZ+2;deadT=2}
// Entrada
$("#menu").addEventListener("click",async e=>{const v=e.target.dataset.v;if(v==null)return;const er=await mapP;if(er){$("#saved").textContent="Erro ao carregar o mapa: "+er.message+(location.protocol=="file:"?" (abra por servidor HTTP/Vercel, não por arquivo local)":"");return}const s=load();P=s&&s.v==+v?s:newP(+v);if(P.x<1000){P.x=TX;P.z=TZ+2}if(blocked(P.x,P.z)){P.x=TX;P.z=TZ+2}hb.material.color.setHex(VOC[P.v].col);setup();$("#menu").hidden=true;$("#hud").hidden=false;$("#ctl").hidden=false;log("Bem-vindo, "+VOC[P.v].n+"!")});
if(load())$("#saved").textContent="Progresso salvo: "+VOC[load().v].n+" nível "+load().l+" (escolha a mesma vocação para continuar)";
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1;if(e.key>="1"&&e.key<="4")cast(+e.key-1);if(e.key.toLowerCase()=="c")cast(0)});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
$("#btns").addEventListener("pointerdown",e=>{const s=e.target.closest("button");if(s)cast(+s.dataset.s)});
const jz=$("#joy");let jid=null;
function jm(e){const r=jz.getBoundingClientRect();let x=e.clientX-r.left-60,y=e.clientY-r.top-60;const d=Math.hypot(x,y);if(d>50){x*=50/d;y*=50/d}joy.x=x/50;joy.y=y/50;$("#knob").style.transform="translate("+x+"px,"+y+"px)"}
jz.addEventListener("pointerdown",e=>{jid=e.pointerId;jz.setPointerCapture(jid);jm(e)});jz.addEventListener("pointermove",e=>{if(e.pointerId==jid)jm(e)});
const jend=e=>{if(e.pointerId==jid){jid=null;joy.x=joy.y=0;$("#knob").style.transform=""}};jz.addEventListener("pointerup",jend);jz.addEventListener("pointercancel",jend);
function bar(id,v,mx,t){const e=$(id);e.firstChild.style.width=Math.max(0,v/mx*100)+"%";e.lastChild.textContent=t}
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  if(P){
    if(deadT>0)deadT-=dt;
    let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
    const L=Math.hypot(dx,dz);if(L>1){dx/=L;dz/=L}haste=Math.max(0,haste-dt);const sp=(6+(haste?4:0))*dt;
    if(L>.05){const nx=P.x+dx*sp,nz=P.z+dz*sp;if(!blocked(nx,P.z))P.x=nx;if(!blocked(P.x,nz))P.z=nz;hero.rotation.y=Math.atan2(dx,dz)}
    hero.position.set(P.x,.1,P.z);
    cds=cds.map(c=>Math.max(0,c-dt));atkCd-=dt;
    if(atkCd<=0){const t=nearest(VOC[P.v].r);if(t){atkCd=1.4;hit(t,dmgOf(1))}}
    const inTown=Math.hypot(P.x-TX,P.z-TZ)<10;rebuild();
    P.mp=Math.min(maxMp(),P.mp+dt*(.5+P.l*.05));P.hp=Math.min(maxHp(),P.hp+dt*(inTown?8:.4+P.l*.03));
    for(const m of mons){
      if(m.dead){m.dead-=dt;if(m.dead<=0)spawn(m);continue}
      const dist=Math.hypot(P.x-m.x,P.z-m.z);m.g.visible=Math.abs(m.x-P.x)<WN-2&&Math.abs(m.z-P.z)<WN-2;if(!m.g.visible)continue;
      if(dist<16&&dist>(m.c.tg>1?m.c.tg-1:1.8)&&!inTown){const s=m.c.sp/100*3.2*dt;const nx=m.x+(P.x-m.x)/dist*s,nz=m.z+(P.z-m.z)/dist*s;if(!blocked(nx,m.z))m.x=nx;if(!blocked(m.x,nz))m.z=nz;m.g.rotation.y=Math.atan2(P.x-m.x,P.z-m.z)}
      m.g.position.set(m.x,.0,m.z);m.g.userData.bar.quaternion.copy(cam.quaternion);
      m.cd-=dt;if(dist<=(m.c.tg>1?m.c.tg:2.2)&&m.cd<=0&&!deadT&&!inTown){const A=m.c.a[0]||["melee",2000,20,0];m.cd=A[1]/1000;const d=Math.round(Math.random()*A[2]);P.hp-=d;if(d)log(m.c.n+" te acerta: -"+d)}}
    if(P.hp<=0)die();
    $("#info").textContent=VOC[P.v].n+" • Nv "+P.l+" • "+P.gold+" gp"+(inTown?" • Cidade (segura)":"");
    bar("#hp",P.hp,maxHp(),"Vida "+Math.ceil(P.hp)+"/"+maxHp());bar("#mp",P.mp,maxMp(),"Mana "+Math.ceil(P.mp)+"/"+maxMp());
    const a=expFor(P.l),b=expFor(P.l+1);bar("#xp",P.xp-a,b-a,"XP "+P.xp+"/"+b);
    cam.position.set(P.x,15,P.z+13);cam.lookAt(P.x,0,P.z);
    saveT+=dt;if(saveT>5){saveT=0;save()}
  }else{cam.position.set(0,20,30);cam.lookAt(0,0,0)}
  for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;fx[i].m.material.opacity=Math.max(0,fx[i].t/.3);if(fx[i].t<=0){scene.remove(fx[i].m);fx.splice(i,1)}}
  ren.render(scene,cam)}
addEventListener("pagehide",()=>P&&save());
requestAnimationFrame(frame);
</script>
</body>
</html>
